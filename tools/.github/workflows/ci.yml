name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Install pre-commit
        run: |
          pip install pre-commit

      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files

      - name: Run pytest (unittest suites)
        # Excludes RealCheckpointChatTests: it requires the full 33,834-title
        # catalog data files (gitignored, regenerable locally) and the HF
        # encoder download. Fake-recommender suites are run instead.
        working-directory: TG-ReDial-main
        run: |
          python -m pytest test_chat_app.py test_chinese_recommender.py \
            -v -k "not RealCheckpointChatTests"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: TG-ReDial-main/.pytest_cache

  docker:
    name: Build Docker image + verify health
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create minimal data stubs for Docker build context
        # The full TG-ReDial-Data/out/ artifacts (embeddings npz, movies.json,
        # order json) are large and gitignored. Create minimal stubs so the
        # Docker image can load the ranker and pass the health check. This
        # validates Docker packaging, not recommendation quality.
        run: |
          mkdir -p TG-ReDial-Data/out
          python - <<'EOF'
          import json, numpy as np
          json.dump({"ids": ["1295242"]}, open("TG-ReDial-Data/out/movie_id_order.json", "w"))
          json.dump({"1295242": {"title": "Test Movie"}}, open("TG-ReDial-Data/out/movies.json", "w"))
          np.savez("TG-ReDial-Data/out/title_embeddings_albert_tiny.npz",
                   embeddings=np.zeros((1, 312), dtype=np.float32))
          print("stub data written")
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tgredial:test

      - name: Run container
        run: |
          docker run -d --name tgredial -p 8000:8000 tgredial:test

      - name: Wait for and verify /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "Health OK"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed" >&2
          docker logs tgredial --tail 80
          exit 1

      - name: POST /api/chat smoke test
        run: |
          code=$(curl -s -o /tmp/chat_resp.json -w "%{http_code}" -X POST http://localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"message":"我想看科幻电影","history":[]}')
          echo "HTTP $code"
          cat /tmp/chat_resp.json
          echo
          test "$code" = "200"

      - name: Collect container logs
        if: always()
        run: |
          docker logs tgredial --tail 100 > container.log 2>&1 || true

      - name: Stop container
        if: always()
        run: |
          docker stop tgredial > /dev/null 2>&1 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-artifacts
          path: |
            container.log
            /tmp/chat_resp.json

  evaluate:
    name: Test-split evaluation smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Create minimal data stubs for evaluation
        # Full catalog data and test split are gitignored (regenerable locally).
        # Create minimal stubs so evaluate_test.py can be exercised end-to-end
        # in CI. This validates the eval script runs without crashing; metric
        # regression assertions require the full data artifacts.
        run: |
          mkdir -p TG-ReDial-Data/out
          python - <<'EOF'
          import json, numpy as np
          json.dump({"ids": ["1295242"]}, open("TG-ReDial-Data/out/movie_id_order.json", "w"))
          json.dump({"1295242": {"title": "Test Movie"}}, open("TG-ReDial-Data/out/movies.json", "w"))
          np.savez("TG-ReDial-Data/out/title_embeddings_albert_tiny.npz",
                   embeddings=np.zeros((1, 312), dtype=np.float32))
          # Minimal test split with one example targeting the stub title.
          with open("TG-ReDial-Data/out/test.jsonl", "w") as f:
              f.write(json.dumps({
                  "context": [{"speaker": "Seeker", "text": "我想看科幻电影"}],
                  "target_movie_ids": [1295242],
                  "dialog_id": "ci-test",
              }) + "\n")
          print("stub eval data written")
          EOF

      - name: Run official test-split evaluation
        working-directory: TG-ReDial-main
        run: |
          python evaluate_test.py \
            --checkpoint ../out_probe/best.pt \
            --test ../TG-ReDial-Data/out/test.jsonl \
            --batch 4

      - name: Upload evaluation metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-metrics
          path: TG-ReDial-main/out_probe/test_metrics.json

